<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ژورنال معاملات</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%224%22 fill=%22%234f9d7c%22/><path d=%22M5 17l4-6 3 3 5-8%22 stroke=%22%230e1210%22 stroke-width=%222%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">ژورنال معاملات</span>
    </div>
    <div class="topbar-actions">
      <button class="btn ghost" id="btn-export-xlsx">خروجی اکسل</button>
      <label class="btn ghost" for="file-import-xlsx">ورودی اکسل</label>
      <input type="file" id="file-import-xlsx" accept=".xlsx,.xls" hidden>
    </div>
  </header>

  <div class="layout">

    <main class="content" id="content">
      <!-- views injected by app.js -->
    </main>

    <nav class="sidenav">
      <button class="nav-item" data-view="dashboard">
        <span class="nav-dot"></span> داشبورد
      </button>
      <button class="nav-item" data-view="new">
        <span class="nav-dot"></span> ثبت معامله
      </button>
      <button class="nav-item" data-view="trades">
        <span class="nav-dot"></span> لیست معاملات
      </button>
      <button class="nav-item" data-view="rules">
        <span class="nav-dot"></span> استراتژی‌ها و قوانین
      </button>
      <button class="nav-item" data-view="notes">
        <span class="nav-dot"></span> یادداشت‌ها
      </button>
      <button class="nav-item" data-view="notes">
        <span class="nav-dot"></span> یادداشت‌ها
      </button>
    </nav>

  </div>

  <div class="toast-host" id="toast-host"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
