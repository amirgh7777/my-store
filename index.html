<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ژورنال معاملات</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%224%22 fill=%22%234f9d7c%22/><path d=%22M5 17l4-6 3 3 5-8%22 stroke=%22%230e1210%22 stroke-width=%222%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">ژورنال معاملات</span>
    </div>
    <div class="topbar-actions">
      <button class="btn ghost" id="btn-export-xlsx">خروجی اکسل</button>
      <label class="btn ghost" for="file-import-xlsx">ورودی اکسل</label>
      <input type="file" id="file-import-xlsx" accept=".xlsx,.xls" hidden>
    </div>
  </header>

  <div class="layout">

    <nav class="sidenav" id="sidenav">
      <button class="nav-toggle" id="nav-toggle" title="باز/بسته کردن منو">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </span>
      </button>

      <button class="nav-item" data-view="dashboard" title="داشبورد">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><rect x="4" y="12" width="4" height="8" rx="1"/><rect x="10" y="7" width="4" height="13" rx="1"/><rect x="16" y="3" width="4" height="17" rx="1"/></svg>
        </span>
        <span class="nav-label">داشبورد</span>
      </button>

      <button class="nav-item" data-view="new" title="ثبت معامله">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </span>
        <span class="nav-label">ثبت معامله</span>
      </button>

      <button class="nav-item" data-view="trades" title="لیست معاملات">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1.3"/><circle cx="4" cy="12" r="1.3"/><circle cx="4" cy="18" r="1.3"/></svg>
        </span>
        <span class="nav-label">لیست معاملات</span>
      </button>

      <button class="nav-item" data-view="rules" title="استراتژی‌ها و قوانین">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M4 5c2-1 5-1 8 1 3-2 6-2 8-1v13c-2-1-5-1-8 1-3-2-6-2-8-1V5z"/></svg>
        </span>
        <span class="nav-label">استراتژی‌ها و قوانین</span>
      </button>

      <button class="nav-item" data-view="checklist" title="چک‌لیست">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l3 3 5-6"/></svg>
        </span>
        <span class="nav-label">چک‌لیست</span>
      </button>

      <button class="nav-item" data-view="pnl" title="حد سود/ضرر">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
        </span>
        <span class="nav-label">حد سود/ضرر</span>
      </button>

      <button class="nav-item" data-view="freenotes" title="یادداشت">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><line x1="10" y1="11" x2="16" y2="11"/><line x1="10" y1="15" x2="16" y2="15"/></svg>
        </span>
        <span class="nav-label">یادداشت</span>
      </button>
    </nav>

    <main class="content" id="content">
      <!-- views injected by app.js -->
    </main>

  </div>

  <div class="toast-host" id="toast-host"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
